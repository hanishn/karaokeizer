[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "karaokeizer"
version = "0.1.0"
description = "A repeatable, evidence-driven pipeline for local instrumental and karaoke players"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Hanish N" }]
keywords = ["karaoke", "audio", "whisper", "demucs", "music-notation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "librosa>=0.10.2,<1",
  "numpy>=1.26,<3",
  "pyphen>=0.17,<1",
  "regex>=2024.11.6,<2027",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
separation = ["demucs>=4.0,<5"]
transcription = ["openai-whisper>=20240930,<20270000"]
fast-transcription = ["faster-whisper>=1.1,<2"]
visual-qa = ["playwright>=1.49,<2"]
dev = ["hatchling>=1.27,<2", "pytest>=8.3,<9", "ruff>=0.8,<1", "playwright>=1.49,<2", "numpy<2.5"]
all = [
  "demucs>=4.0,<5",
  "openai-whisper>=20240930,<20270000",
  "faster-whisper>=1.1,<2",
  "playwright>=1.49,<2",
]

[project.scripts]
karaokeizer-album = "karaokeizer.instrumental_album_pipeline:main"
karaokeizer-transcribe = "karaokeizer.transcribe_karaoke_vocals:main"
karaokeizer-audit-transcripts = "karaokeizer.audit_karaoke_transcripts:main"
karaokeizer-audit-album = "karaokeizer.audit_karaoke_album:main"
karaokeizer-compare-transcripts = "karaokeizer.compare_karaoke_transcripts:main"
karaokeizer-build-escalation = "karaokeizer.build_karaoke_escalation_ledger:main"
karaokeizer-remediate = "karaokeizer.remediate_karaoke_regions:main"
karaokeizer-classify-instrumentals = "karaokeizer.classify_karaoke_instrumentals:main"
karaokeizer-repair-region = "karaokeizer.repair_karaoke_transcript_segment:main"
karaokeizer-build-player = "karaokeizer.build_karaoke_overlay:main"
karaokeizer-audit-player = "karaokeizer.audit_karaoke_player_visual:main"
karaokeizer-serve = "karaokeizer.serve_karaoke:main"
karaokeizer-promote = "karaokeizer.promote:main"
karaokeizer-manifest-ssli = "karaokeizer.ssli_manifest:main"
karaokeizer-prepare-ssli = "karaokeizer.prepare_ssli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/karaokeizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
